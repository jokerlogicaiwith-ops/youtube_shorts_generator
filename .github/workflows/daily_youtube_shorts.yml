name: Daily YouTube Shorts Uploader

on:
  schedule:
    # Runs daily 3 times at peak viral hours (8:30 AM, 1:30 PM, and 7:30 PM IST)
    # UTC equivalents: 3:00 AM UTC, 8:00 AM UTC, 2:00 PM UTC
    - cron: '0 3,8,14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-uploader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials files from secrets
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TOKEN_CONTENT: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$CLIENT_SECRET_CONTENT" > client_secret.json
          echo "$TOKEN_CONTENT" > token.json

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python main.py
