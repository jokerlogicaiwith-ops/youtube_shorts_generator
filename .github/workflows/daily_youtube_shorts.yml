name: Daily YouTube Shorts Uploader

on:
  schedule:
    # Runs daily at 10:00 AM UTC (approx 3:30 PM IST)
    # Aap is schedule cron ko edit karke time change kar sakte hain.
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-uploader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials files from secrets
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TOKEN_CONTENT: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$CLIENT_SECRET_CONTENT" > client_secret.json
          echo "$TOKEN_CONTENT" > token.json

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py
